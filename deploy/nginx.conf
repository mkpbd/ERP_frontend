# Example nginx server block for the production build (dist/erp-frontend/browser).
# Serves the SPA and reverse-proxies /api to the NestJS backend on the same origin, which keeps the
# SameSite=Strict refresh cookie working and avoids CORS entirely. Terminate TLS in front of this
# (or add `listen 443 ssl`); the backend must run with COOKIE_SECURE=true in production.

server {
  listen 80;
  server_name erp.example.com;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. Tighten connect-src/img-src if the API or assets move to another origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API → backend. The backend trusts X-Forwarded-* only with TRUST_PROXY=true.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change: cache for a year.
  location ~* \.(?:js|css|woff2?|ttf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html must always be revalidated so users pick up new deployments.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # SPA fallback: unknown paths (deep links such as /users/123) serve the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
